<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>2048</title>
<style>
  :root {
    --bg: #faf8ef;
    --board-bg: #bbada0;
    --cell-bg: rgba(238, 228, 218, 0.35);
    --text-dark: #776e65;
    --text-light: #f9f6f2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: "Segoe UI", "Microsoft JhengHei", Arial, sans-serif;
    color: var(--text-dark);
  }
  .app { width: min(94vw, 480px); }
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 2.6rem;
    margin: 0;
    font-weight: 800;
    color: var(--text-dark);
  }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: var(--board-bg);
    color: var(--text-light);
    border-radius: 6px;
    padding: 8px 16px;
    text-align: center;
    min-width: 70px;
  }
  .score-box .label { font-size: 0.7rem; opacity: 0.8; letter-spacing: 1px; }
  .score-box .value { font-size: 1.3rem; font-weight: 700; }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .hint { font-size: 0.85rem; color: #8c8177; }
  button.new-game {
    background: #8f7a66;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button.new-game:hover { background: #7a6656; }
  .board-wrap {
    position: relative;
    background: var(--board-bg);
    border-radius: 8px;
    padding: 10px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
  }
  .cell {
    aspect-ratio: 1 / 1;
    background: var(--cell-bg);
    border-radius: 6px;
  }
  .tiles { position: absolute; inset: 10px; }
  .tile {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    font-weight: 800;
    transition: top 0.12s ease, left 0.12s ease;
    animation: pop 0.15s ease;
  }
  @keyframes pop {
    0% { transform: scale(0.4); opacity: 0.4; }
    100% { transform: scale(1); opacity: 1; }
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(238, 228, 218, 0.73);
    border-radius: 8px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
  }
  .overlay.show { display: flex; }
  .overlay .msg { font-size: 2rem; font-weight: 800; color: var(--text-dark); }
  .overlay button {
    background: #8f7a66;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px 20px;
    font-weight: 700;
    cursor: pointer;
  }
  footer { margin-top: 14px; font-size: 0.8rem; color: #8c8177; text-align: center; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>2048</h1>
    <div class="scores">
      <div class="score-box">
        <div class="label">分數</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="label">最高分</div>
        <div class="value" id="best">0</div>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="hint">方向鍵 / WASD 移動,滑動手機螢幕也可以</div>
    <button class="new-game" id="newGame">重新開始</button>
  </div>

  <div class="board-wrap">
    <div class="grid" id="grid"></div>
    <div class="tiles" id="tiles"></div>
    <div class="overlay" id="overlay">
      <div class="msg" id="overlayMsg"></div>
      <button id="overlayBtn">再玩一次</button>
    </div>
  </div>

  <footer>合併相同數字的方塊,湊出 2048 吧!</footer>
</div>

<script>
(function () {
  const SIZE = 4;
  const tileColors = {
    2:    { bg: "#eee4da", fg: "#776e65" },
    4:    { bg: "#ede0c8", fg: "#776e65" },
    8:    { bg: "#f2b179", fg: "#f9f6f2" },
    16:   { bg: "#f59563", fg: "#f9f6f2" },
    32:   { bg: "#f67c5f", fg: "#f9f6f2" },
    64:   { bg: "#f65e3b", fg: "#f9f6f2" },
    128:  { bg: "#edcf72", fg: "#f9f6f2" },
    256:  { bg: "#edcc61", fg: "#f9f6f2" },
    512:  { bg: "#edc850", fg: "#f9f6f2" },
    1024: { bg: "#edc53f", fg: "#f9f6f2" },
    2048: { bg: "#edc22e", fg: "#f9f6f2" },
  };
  const superTile = { bg: "#3c3a32", fg: "#f9f6f2" };

  const gridEl = document.getElementById("grid");
  const tilesEl = document.getElementById("tiles");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const overlayEl = document.getElementById("overlay");
  const overlayMsgEl = document.getElementById("overlayMsg");

  let board, score, best, won, over, nextId;

  function emptyBoard() {
    return Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
  }

  function init() {
    board = emptyBoard();
    score = 0;
    won = false;
    over = false;
    nextId = 1;
    best = Number(localStorage.getItem("game2048_best") || 0);
    bestEl.textContent = best;
    overlayEl.classList.remove("show");
    gridEl.innerHTML = "";
    for (let i = 0; i < SIZE * SIZE; i++) gridEl.appendChild(document.createElement("div")).className = "cell";
    addRandomTile();
    addRandomTile();
    render();
  }

  function addRandomTile() {
    const empties = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (!board[r][c]) empties.push([r, c]);
    if (!empties.length) return;
    const [r, c] = empties[Math.floor(Math.random() * empties.length)];
    board[r][c] = { value: Math.random() < 0.9 ? 2 : 4, id: nextId++, isNew: true };
  }

  function cellSize() {
    const wrap = document.querySelector(".board-wrap");
    const inner = wrap.clientWidth - 20; // padding 10 each side
    return (inner - 10 * 3) / 4; // 3 gaps of 10px
  }

  function render() {
    const size = cellSize();
    const gap = 10;
    tilesEl.innerHTML = "";
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const t = board[r][c];
        if (!t) continue;
        const el = document.createElement("div");
        el.className = "tile";
        const colors = tileColors[t.value] || superTile;
        el.style.background = colors.bg;
        el.style.color = colors.fg;
        el.style.width = size + "px";
        el.style.height = size + "px";
        el.style.left = c * (size + gap) + "px";
        el.style.top = r * (size + gap) + "px";
        el.style.fontSize = (t.value > 512 ? size * 0.32 : size * 0.4) + "px";
        el.textContent = t.value;
        tilesEl.appendChild(el);
      }
    }
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      localStorage.setItem("game2048_best", best);
      bestEl.textContent = best;
    }
  }

  function cloneBoard() {
    return board.map((row) => row.map((cell) => (cell ? { ...cell } : null)));
  }

  function boardsEqual(a, b) {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++) {
        const av = a[r][c] ? a[r][c].value : 0;
        const bv = b[r][c] ? b[r][c].value : 0;
        if (av !== bv) return false;
      }
    return true;
  }

  // Compresses+merges one line (array of cells, index 0 = leading edge)
  function processLine(line) {
    let cells = line.filter(Boolean);
    for (let i = 0; i < cells.length - 1; i++) {
      if (cells[i].value === cells[i + 1].value) {
        cells[i] = { value: cells[i].value * 2, id: cells[i].id, merged: true };
        score += cells[i].value;
        if (cells[i].value === 2048) won = true;
        cells.splice(i + 1, 1);
      }
    }
    while (cells.length < SIZE) cells.push(null);
    return cells;
  }

  function getLine(dir, index) {
    const line = [];
    for (let i = 0; i < SIZE; i++) {
      if (dir === "left") line.push(board[index][i]);
      else if (dir === "right") line.push(board[index][SIZE - 1 - i]);
      else if (dir === "up") line.push(board[i][index]);
      else if (dir === "down") line.push(board[SIZE - 1 - i][index]);
    }
    return line;
  }

  function setLine(dir, index, line) {
    for (let i = 0; i < SIZE; i++) {
      let r, c;
      if (dir === "left") { r = index; c = i; }
      else if (dir === "right") { r = index; c = SIZE - 1 - i; }
      else if (dir === "up") { r = i; c = index; }
      else if (dir === "down") { r = SIZE - 1 - i; c = index; }
      board[r][c] = line[i];
    }
  }

  function move(dir) {
    if (over) return;
    const before = cloneBoard();
    for (let i = 0; i < SIZE; i++) {
      const line = getLine(dir, i);
      const processed = processLine(line);
      setLine(dir, i, processed);
    }
    if (!boardsEqual(before, board)) {
      addRandomTile();
      render();
      if (won) {
        showOverlay("你贏了! 🎉");
      } else if (!hasMoves()) {
        over = true;
        showOverlay("遊戲結束 💀");
      }
    }
  }

  function hasMoves() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (!board[r][c]) return true;
        const v = board[r][c].value;
        if (c < SIZE - 1 && board[r][c + 1] && board[r][c + 1].value === v) return true;
        if (r < SIZE - 1 && board[r + 1][c] && board[r + 1][c].value === v) return true;
      }
    }
    return false;
  }

  function showOverlay(msg) {
    overlayMsgEl.textContent = msg;
    overlayEl.classList.add("show");
  }

  document.getElementById("overlayBtn").addEventListener("click", init);
  document.getElementById("newGame").addEventListener("click", init);

  const keyMap = {
    ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down",
    a: "left", d: "right", w: "up", s: "down",
    A: "left", D: "right", W: "up", S: "down",
  };
  window.addEventListener("keydown", (e) => {
    const dir = keyMap[e.key];
    if (dir) {
      e.preventDefault();
      if (overlayEl.classList.contains("show") && !won) return;
      move(dir);
    }
  });

  // Touch swipe support
  let touchStartX = 0, touchStartY = 0;
  const wrap = document.querySelector(".board-wrap");
  wrap.addEventListener("touchstart", (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  wrap.addEventListener("touchend", (e) => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? "right" : "left");
    else move(dy > 0 ? "down" : "up");
  }, { passive: true });

  window.addEventListener("resize", render);

  init();
})();
</script>
</body>
</html>
