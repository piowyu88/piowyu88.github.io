<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>奧蕾莉亞的煉金坊 — 放置遊戲</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #0d1f1c;
    --bg-panel: #16302b;
    --bg-panel-light: #1f4038;
    --line: rgba(212,175,55,0.18);
    --parchment: #ece2c6;
    --parchment-dim: #b9ae91;
    --gold: #d4af37;
    --gold-bright: #f3d576;
    --ember: #d97a3d;
    --glow: #5fe0c7;
    --violet: #b48ce0;
    --danger: #b5573f;
    --shadow: rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  *{
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  body{
    background: radial-gradient(ellipse at 50% -10%, #1b3a33 0%, var(--bg-deep) 55%, #081613 100%);
    color: var(--parchment);
    font-family: 'EB Garamond', serif;
    min-height: 100vh;
    padding: 28px 20px 60px;
  }
  h1,h2,h3,.display{
    font-family: 'Cinzel', serif;
    letter-spacing: 0.03em;
    margin: 0;
  }
  .wrap{
    max-width: 1080px;
    margin: 0 auto;
  }
  header{
    text-align:center;
    margin-bottom: 22px;
  }
  header .eyebrow{
    font-size: 12px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.85;
  }
  header h1{
    font-size: 34px;
    font-weight: 900;
    color: var(--parchment);
    text-shadow: 0 0 18px rgba(212,175,55,0.25);
    margin-top: 4px;
  }
  header p{
    color: var(--parchment-dim);
    font-style: italic;
    margin-top: 6px;
    font-size: 15px;
  }

  .layout{
    display:grid;
    grid-template-columns: 340px 1fr;
    gap: 22px;
  }
  @media (max-width: 820px){
    .layout{ grid-template-columns: 1fr; }
  }

  .panel{
    background: linear-gradient(160deg, var(--bg-panel) 0%, #122824 100%);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
    box-shadow: 0 10px 30px var(--shadow);
  }

  /* --- Cauldron signature element --- */
  .cauldron-stage{
    text-align:center;
    padding-bottom: 6px;
    position: relative;
  }
  .essence-count{
    font-family:'Cinzel', serif;
    font-size: 30px;
    font-weight: 700;
    color: var(--gold-bright);
    text-shadow: 0 0 12px rgba(243,213,118,0.35);
  }
  .essence-rate{
    color: var(--glow);
    font-size: 13px;
    margin-top: 2px;
    letter-spacing: 0.02em;
  }
  svg#cauldron{
    width: 220px;
    height: 220px;
    display:block;
    margin: 14px auto 6px;
    cursor: pointer;
    user-select:none;
    -webkit-tap-highlight-color: transparent;
  }
  .stir-btn{
    display:inline-block;
    margin-top: 6px;
    padding: 10px 22px;
    border-radius: 999px;
    border: 1px solid var(--gold);
    background: linear-gradient(180deg, #2a4a41, #16302b);
    color: var(--gold-bright);
    font-family:'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.08s ease, box-shadow 0.2s ease;
  }
  .stir-btn:hover{ box-shadow: 0 0 14px rgba(212,175,55,0.4); }
  .stir-btn:active{ transform: scale(0.96); }
  .stir-hint{
    display:block;
    margin-top:6px;
    font-size: 12px;
    color: var(--parchment-dim);
    font-style: italic;
  }

  .stat-line{
    display:flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--parchment-dim);
    padding: 5px 0;
    border-top: 1px dashed var(--line);
  }
  .stat-line span:last-child{ color: var(--parchment); }

  /* --- Prestige --- */
  .prestige-box{
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .prestige-box h3{
    font-size: 14px;
    color: var(--violet);
    margin-bottom: 4px;
  }
  .prestige-box .crystal-count{
    font-size: 20px;
    color: var(--violet);
    font-family:'Cinzel', serif;
  }
  .prestige-box .mult-line{
    font-size: 12px;
    color: var(--parchment-dim);
    margin: 4px 0 10px;
  }
  .prestige-btn{
    width:100%;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--violet);
    background: linear-gradient(180deg, #35284a, #1c1530);
    color: #e2cfff;
    font-family:'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 0.04em;
    cursor:pointer;
  }
  .prestige-btn:hover{ box-shadow: 0 0 14px rgba(180,140,224,0.35); }
  .prestige-btn:disabled{
    opacity: 0.35;
    cursor:not-allowed;
    box-shadow:none;
  }
  .prestige-note{
    font-size: 11px;
    color: var(--parchment-dim);
    margin-top: 6px;
    line-height: 1.5;
  }

  /* --- Shop --- */
  .shop-header{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .shop-header h2{ font-size: 18px; color: var(--gold-bright); }
  .shop-header .sub{ font-size: 12px; color: var(--parchment-dim); }

  .producer{
    display:grid;
    grid-template-columns: 46px 1fr auto;
    gap: 12px;
    align-items:center;
    padding: 10px 10px;
    border-radius: 8px;
    border: 1px solid transparent;
    margin-bottom: 8px;
    background: rgba(255,255,255,0.02);
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .producer.affordable{ border-color: var(--line); }
  .producer.affordable:hover{
    background: rgba(212,175,55,0.06);
    border-color: var(--gold);
  }
  .producer .icon{
    width:46px; height:46px;
    display:flex; align-items:center; justify-content:center;
    font-size: 22px;
    background: var(--bg-panel-light);
    border-radius: 8px;
    border: 1px solid var(--line);
  }
  .producer .name{
    font-family:'Cinzel', serif;
    font-size: 14px;
    color: var(--parchment);
  }
  .producer .desc{
    font-size: 12px;
    color: var(--parchment-dim);
    font-style: italic;
    margin-top: 2px;
  }
  .producer .meta{
    font-size: 11px;
    color: var(--glow);
    margin-top: 3px;
  }
  .buy-btn{
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--gold);
    background: var(--bg-panel-light);
    color: var(--gold-bright);
    font-family:'Cinzel', serif;
    font-size: 12px;
    text-align:center;
    cursor:pointer;
    min-width: 92px;
    transition: transform 0.08s ease;
  }
  .buy-btn:disabled{
    opacity: 0.35;
    cursor: not-allowed;
    border-color: var(--parchment-dim);
    color: var(--parchment-dim);
  }
  .buy-btn:not(:disabled):hover{ transform: translateY(-1px); }
  .buy-btn small{ display:block; font-family:'EB Garamond',serif; font-size:11px; margin-top:2px; }

  .owned-badge{ font-size: 11px; color: var(--ember); margin-left: 6px; }

  #toast-zone{
    position: fixed;
    top: 16px;
    right: 16px;
    display:flex;
    flex-direction: column;
    gap: 8px;
    z-index: 50;
  }
  .toast{
    background: linear-gradient(160deg, #2a4a41, #16302b);
    border: 1px solid var(--gold);
    color: var(--gold-bright);
    font-family:'Cinzel', serif;
    font-size: 12px;
    padding: 10px 14px;
    border-radius: 8px;
    box-shadow: 0 6px 20px var(--shadow);
    animation: toast-in 0.25s ease, toast-out 0.4s ease 2.6s forwards;
  }
  @keyframes toast-in{ from{ opacity:0; transform: translateX(20px);} to{opacity:1; transform:translateX(0);} }
  @keyframes toast-out{ to{ opacity:0; transform: translateX(20px);} }

  .footer-note{
    text-align:center;
    margin-top: 28px;
    font-size: 12px;
    color: var(--parchment-dim);
    font-style: italic;
    opacity: 0.7;
  }

  .bubble{
    position: absolute;
    pointer-events: none;
    font-family:'Cinzel', serif;
    color: var(--gold-bright);
    font-size: 14px;
    animation: rise 0.9s ease-out forwards;
  }
  @keyframes rise{
    from{ opacity: 1; transform: translateY(0); }
    to{ opacity: 0; transform: translateY(-46px); }
  }

  /* --- Modal --- */
  .modal-overlay{
    position: fixed;
    inset: 0;
    background: rgba(5,12,10,0.7);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 100;
  }
  .modal-box{
    background: linear-gradient(160deg, #1c3a33, #0f221e);
    border: 1px solid var(--gold);
    border-radius: 12px;
    padding: 24px;
    max-width: 340px;
    text-align:center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .modal-box h3{ color: var(--gold-bright); font-size: 17px; margin-bottom: 10px; }
  .modal-box p{ font-size: 13px; color: var(--parchment-dim); line-height: 1.6; margin-bottom: 18px; }
  .modal-actions{ display:flex; gap: 10px; justify-content:center; }
  .modal-actions button{
    padding: 8px 18px;
    border-radius: 6px;
    font-family:'Cinzel', serif;
    font-size: 12px;
    cursor:pointer;
  }
  .modal-confirm{ border: 1px solid var(--violet); background: #35284a; color: #e2cfff; }
  .modal-cancel{ border: 1px solid var(--line); background: transparent; color: var(--parchment-dim); }
</style>
</head>
<body>

<div id="toast-zone"></div>

<div class="wrap">
  <header>
    <div class="eyebrow">閒暇之間 · 蒸餾成金</div>
    <h1>奧蕾莉亞的煉金坊</h1>
    <p>爐火不熄,靈蘊自生 —— 即使你闔上書卷,坊中亦在運作。</p>
  </header>

  <div class="layout">
    <!-- LEFT: Cauldron -->
    <div class="panel cauldron-stage">
      <div class="essence-count" id="essenceCount">0</div>
      <div class="essence-rate" id="essenceRate">每秒 +0 靈蘊</div>

      <svg id="cauldron" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="liquidGrad" cx="50%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#8fe9d6" id="liqStop1"/>
            <stop offset="100%" stop-color="#2a8a76" id="liqStop2"/>
          </radialGradient>
          <linearGradient id="potGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3a3a3a"/>
            <stop offset="100%" stop-color="#151515"/>
          </linearGradient>
        </defs>
        <ellipse cx="100" cy="176" rx="52" ry="7" fill="#3a1c10" opacity="0.6"/>
        <path d="M60 172 L75 182 L90 170 L105 183 L120 170 L140 180" stroke="var(--ember)" stroke-width="3" fill="none" opacity="0.8" stroke-linecap="round"/>
        <g class="cauldron-body">
          <path d="M40 95 C40 150 65 175 100 175 C135 175 160 150 160 95 Z" fill="url(#potGrad)" stroke="#000" stroke-width="2"/>
          <ellipse cx="100" cy="95" rx="60" ry="14" fill="#111"/>
          <ellipse cx="100" cy="92" rx="54" ry="11" fill="url(#liquidGrad)" id="liquidSurface"/>
          <circle cx="34" cy="88" r="8" fill="none" stroke="#111" stroke-width="5"/>
          <circle cx="166" cy="88" r="8" fill="none" stroke="#111" stroke-width="5"/>
        </g>
      </svg>

      <div class="stir-btn" id="stirBtn">攪動大鍋</div>
      <span class="stir-hint">每次攪動獲得靈蘊</span>

      <div style="margin-top:16px;">
        <div class="stat-line"><span>歷史總煉成</span><span id="totalEarned">0</span></div>
        <div class="stat-line"><span>手動攪動次數</span><span id="totalClicks">0</span></div>
        <div class="stat-line"><span>坊內設施</span><span id="totalBuildings">0</span></div>
      </div>

      <div class="prestige-box">
        <h3>賢者結晶</h3>
        <div class="crystal-count" id="crystalCount">0 顆</div>
        <div class="mult-line" id="multLine">目前產出倍率 ×1.00</div>
        <button class="prestige-btn" id="prestigeBtn">蒸餾賢者結晶(重生)</button>
        <div class="prestige-note">重生會將靈蘊與設施歸零重建,但依歷史總煉成量換算的產出倍率會永久保留 —— 讓每一輪都比上一輪更快。</div>
      </div>
    </div>

    <!-- RIGHT: Shop -->
    <div class="panel">
      <div class="shop-header">
        <h2>坊中設施</h2>
        <span class="sub">購買設施,持續自動煉製靈蘊</span>
      </div>
      <div id="shopList"></div>
    </div>
  </div>

  <div class="footer-note" id="footerNote">進度會自動保存,隨時可以離開再回來繼續煉金。</div>
</div>

<div id="modalRoot"></div>

<script>
(function(){
  // ---------- Config ----------
  const SAVE_KEY = 'aurelia-alchemy-save';

  const producerDefs = [
    { key:'garden',  name:'藥草田',     desc:'月光下生長的低階藥草,緩慢滲出靈蘊。', icon:'🌿', baseCost:10,      baseProd:0.1,  costMult:1.15 },
    { key:'alembic', name:'蒸餾曲頸瓶', desc:'讓藥草精華在曲頸瓶中反覆凝結。',       icon:'⚗️', baseCost:100,     baseProd:1,    costMult:1.15 },
    { key:'still',   name:'煙霧蒸酒器', desc:'用微火慢煮,萃取更純的靈蘊。',         icon:'🔥', baseCost:1200,    baseProd:8,    costMult:1.16 },
    { key:'coven',   name:'女巫議會圈', desc:'眾人環坐吟唱,靈蘊自石陣中湧現。',     icon:'🕯️', baseCost:13000,   baseProd:47,   costMult:1.16 },
    { key:'leyline', name:'地脈之井',   desc:'鑿穿地脈,汲取大地深處的靈流。',       icon:'🌀', baseCost:140000,  baseProd:260,  costMult:1.17 },
    { key:'astral',  name:'星辰蒸餾塔', desc:'塔尖直指夜空,收集星光中的靈蘊。',     icon:'✨', baseCost:1600000, baseProd:1400, costMult:1.18 },
  ];

  // ---------- State ----------
  let state = {
    essence: 0,
    lifetimeEarned: 0,   // never reset by prestige — drives crystals & liquid color forever
    totalClicks: 0,
    producers: {}        // key -> owned count
  };
  producerDefs.forEach(p => state.producers[p.key] = 0);

  let lastMagnitudeFloor = -1; // for milestone toasts based on order of magnitude

  // ---------- Helpers ----------
  function fmt(n){
    if(!isFinite(n)) return '∞';
    if(n < 0) return '0';
    if(n < 1000) return n < 10 ? n.toFixed(2) : n.toFixed(1);
    const units = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd','Td','Qad','Qid','Sxd','Spd','Ocd','Nod','Vg'];
    const tier = Math.floor(Math.log10(n) / 3);
    if(tier < units.length){
      const scaled = n / Math.pow(1000, tier);
      return scaled.toFixed(2) + units[tier];
    }
    return n.toExponential(2);
  }

  function crystals(){
    return Math.floor(Math.sqrt(state.lifetimeEarned / 1e5));
  }
  function multiplier(){
    return 1 + crystals() * 0.1;
  }
  function costFor(def, owned){
    return Math.ceil(def.baseCost * Math.pow(def.costMult, owned));
  }
  function totalProdPerSec(){
    return producerDefs.reduce((s,p) => s + state.producers[p.key] * p.baseProd, 0) * multiplier();
  }
  function clickGain(){
    return 1 * multiplier();
  }

  function liquidColors(){
    const magnitude = Math.log10(state.lifetimeEarned + 10);
    const hue = (magnitude * 47) % 360;
    const hue2 = (hue + 140) % 360;
    return {
      c1: `hsl(${hue.toFixed(0)}, 70%, 70%)`,
      c2: `hsl(${hue2.toFixed(0)}, 55%, 32%)`
    };
  }
  function updateLiquidColor(){
    const {c1, c2} = liquidColors();
    document.getElementById('liqStop1').setAttribute('stop-color', c1);
    document.getElementById('liqStop2').setAttribute('stop-color', c2);
  }
  function checkMagnitudeMilestone(){
    const mag = Math.floor(Math.log10(state.lifetimeEarned + 10));
    if(mag > lastMagnitudeFloor){
      lastMagnitudeFloor = mag;
      updateLiquidColor();
      if(mag > 1) toast('鍋中靈蘊變了色 —— 煉金術更進一步');
    }
  }

  function toast(msg){
    const zone = document.getElementById('toast-zone');
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    zone.appendChild(el);
    setTimeout(()=> el.remove(), 3000);
  }

  function spawnBubbleText(text, x, y){
    const stage = document.querySelector('.cauldron-stage');
    const el = document.createElement('div');
    el.className = 'bubble';
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    stage.appendChild(el);
    setTimeout(()=> el.remove(), 950);
  }

  // ---------- Rendering ----------
  function renderShop(){
    const list = document.getElementById('shopList');
    list.innerHTML = '';
    producerDefs.forEach(def => {
      const owned = state.producers[def.key];
      const cost = costFor(def, owned);
      const affordable = state.essence >= cost;
      const row = document.createElement('div');
      row.className = 'producer ' + (affordable ? 'affordable' : '');
      row.innerHTML = `
        <div class="icon">${def.icon}</div>
        <div>
          <div class="name">${def.name} ${owned > 0 ? `<span class="owned-badge">×${owned}</span>` : ''}</div>
          <div class="desc">${def.desc}</div>
          <div class="meta">產出 ${fmt(def.baseProd * multiplier())}/秒 · 目前貢獻 ${fmt(owned*def.baseProd*multiplier())}/秒</div>
        </div>
        <button class="buy-btn" data-key="${def.key}" ${affordable ? '' : 'disabled'}>
          購買
          <small>${fmt(cost)} 靈蘊</small>
        </button>
      `;
      list.appendChild(row);
    });
    list.querySelectorAll('.buy-btn').forEach(btn => {
      btn.addEventListener('click', () => buy(btn.dataset.key));
    });
  }

  function buy(key){
    const def = producerDefs.find(x => x.key === key);
    const owned = state.producers[key];
    const cost = costFor(def, owned);
    if(state.essence < cost) return;
    state.essence -= cost;
    state.producers[key] += 1;
    if(owned === 0) toast(`「${def.name}」開始運作了`);
    renderShop();
    updateTopStats();
    saveState();
  }

  function updateTopStats(){
    document.getElementById('essenceCount').textContent = fmt(state.essence) + ' 靈蘊';
    document.getElementById('essenceRate').textContent = '每秒 +' + fmt(totalProdPerSec()) + ' 靈蘊';
    document.getElementById('totalEarned').textContent = fmt(state.lifetimeEarned);
    document.getElementById('totalClicks').textContent = state.totalClicks;
    document.getElementById('totalBuildings').textContent = producerDefs.reduce((s,p)=>s+state.producers[p.key],0);
    document.getElementById('crystalCount').textContent = crystals() + ' 顆';
    document.getElementById('multLine').textContent = '目前產出倍率 ×' + multiplier().toFixed(2);

    const btn = document.getElementById('prestigeBtn');
    const minToPrestige = 1000;
    btn.disabled = state.lifetimeEarned < minToPrestige;
    btn.textContent = state.lifetimeEarned < minToPrestige
      ? `再累積 ${fmt(minToPrestige - state.lifetimeEarned)} 靈蘊即可重生`
      : '蒸餾賢者結晶(重生)';
  }

  // ---------- Interaction ----------
  const cauldron = document.getElementById('cauldron');
  const stirBtn = document.getElementById('stirBtn');

  function stir(evt){
    const gain = clickGain();
    state.essence += gain;
    state.lifetimeEarned += gain;
    state.totalClicks += 1;

    const rect = document.querySelector('.cauldron-stage').getBoundingClientRect();
    let x = 110, y = 90;
    if(evt && evt.clientX){
      x = evt.clientX - rect.left;
      y = evt.clientY - rect.top;
    }
    spawnBubbleText('+' + fmt(gain), x, y);

    updateTopStats();
    renderShop();
    checkMagnitudeMilestone();
  }

  cauldron.addEventListener('click', stir);
  stirBtn.addEventListener('click', stir);
  // extra safety net against text/element selection on rapid clicking
  [cauldron, stirBtn].forEach(el => {
    el.addEventListener('mousedown', e => e.preventDefault());
    el.addEventListener('selectstart', e => e.preventDefault());
    el.addEventListener('dragstart', e => e.preventDefault());
  });
  document.addEventListener('selectstart', e => e.preventDefault());

  // ---------- Prestige ----------
  function showPrestigeModal(){
    const root = document.getElementById('modalRoot');
    const preMult = multiplier().toFixed(2);
    root.innerHTML = `
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
          <h3>確定要重生嗎?</h3>
          <p>目前的靈蘊與所有設施將會歸零重建,但你的產出倍率(目前 ×${preMult})會永久保留,並隨歷史總煉成量持續提升。這能讓下一輪的成長比這一輪更快。</p>
          <div class="modal-actions">
            <button class="modal-cancel" id="modalCancel">再想想</button>
            <button class="modal-confirm" id="modalConfirm">蒸餾結晶</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('modalCancel').addEventListener('click', () => root.innerHTML = '');
    document.getElementById('modalOverlay').addEventListener('click', (e) => { if(e.target.id === 'modalOverlay') root.innerHTML = ''; });
    document.getElementById('modalConfirm').addEventListener('click', () => {
      doPrestige();
      root.innerHTML = '';
    });
  }

  function doPrestige(){
    state.essence = 0;
    producerDefs.forEach(p => state.producers[p.key] = 0);
    renderShop();
    updateTopStats();
    saveState();
    toast('重生完成 —— 產出倍率 ×' + multiplier().toFixed(2));
  }

  document.getElementById('prestigeBtn').addEventListener('click', () => {
    if(document.getElementById('prestigeBtn').disabled) return;
    showPrestigeModal();
  });

  // ---------- Persistence ----------
  async function saveState(){
    try{
      await window.storage.set(SAVE_KEY, JSON.stringify(state), false);
    }catch(err){
      console.error('存檔失敗', err);
    }
  }

  async function loadState(){
    const footer = document.getElementById('footerNote');
    try{
      const result = await window.storage.get(SAVE_KEY, false);
      if(result && result.value){
        const loaded = JSON.parse(result.value);
        state.essence = loaded.essence || 0;
        state.lifetimeEarned = loaded.lifetimeEarned || 0;
        state.totalClicks = loaded.totalClicks || 0;
        producerDefs.forEach(p => {
          state.producers[p.key] = (loaded.producers && loaded.producers[p.key]) || 0;
        });
        toast('歡迎回到煉金坊,進度已恢復');
      }
    }catch(err){
      // no existing save — fresh start, that's fine
      footer.textContent = '進度會自動保存,隨時可以離開再回來繼續煉金。';
    }
  }

  // ---------- Game loop ----------
  let lastTick = performance.now();
  function tick(now){
    const dt = Math.min((now - lastTick) / 1000, 1);
    lastTick = now;
    const gain = totalProdPerSec() * dt;
    if(gain > 0){
      state.essence += gain;
      state.lifetimeEarned += gain;
    }
    updateTopStats();
    checkMagnitudeMilestone();
    requestAnimationFrame(tick);
  }

  setInterval(renderShop, 500);
  setInterval(saveState, 6000);
  document.addEventListener('visibilitychange', () => { if(document.hidden) saveState(); });

  // ---------- Init ----------
  (async function init(){
    await loadState();
    renderShop();
    updateTopStats();
    updateLiquidColor();
    lastMagnitudeFloor = Math.floor(Math.log10(state.lifetimeEarned + 10));
    requestAnimationFrame(tick);
  })();
})();
</script>
</body>
</html>
